<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cena Guia — notebook + celular na landing</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 800px; overflow: hidden; background: #F4EEE0; position: relative; }
  /* Base 6% ampliada para jogar a moldura pintada da IA para fora do quadro;
     laterais e topo esfumados no creme da landing (--bg #F4EEE0). */
  img.base {
    position: absolute; left: -36px; top: -24px; width: 1272px; height: 848px;
    -webkit-mask-image:
      linear-gradient(to right, transparent 36px, #000 176px, #000 1116px, transparent 1236px),
      linear-gradient(to bottom, transparent 24px, #000 120px, #000 848px);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 36px, #000 176px, #000 1116px, transparent 1236px),
      linear-gradient(to bottom, transparent 24px, #000 120px, #000 848px);
    mask-composite: intersect;
  }
  .tela { position: absolute; left: 0; top: 0; overflow: hidden; background: #F6F2EA; }
  #tela-nb { width: 1363px; height: 832px; border-radius: 26px; }
  #tela-nb img { display: block; width: 1363px; }
  #tela-ph { width: 137px; height: 284px; border-radius: 14px; }
  #tela-ph img { display: block; width: 145px; margin: -29px 0 0 -4px; }
  /* Ilha da câmera repintada da base por cima do conteúdo (hardware flutua sobre o app) */
  #ilha {
    position: absolute; left: 967px; top: 358px; width: 81px; height: 26px;
    background-image: url('cena-base-ia.png');
    background-size: 1272px 848px;
    background-position: -1003px -382px;
  }
</style>
</head>
<body>
  <img class="base" src="cena-base-ia.png" alt="">
  <div class="tela" id="tela-nb"><img src="tela-roteiro-desktop.png" alt=""></div>
  <div class="tela" id="tela-ph"><img src="tela-patacho.jpg" alt=""></div>
  <div id="ilha"></div>
  <script>
    function adj(m) {
      return [
        m[4]*m[8]-m[5]*m[7], m[2]*m[7]-m[1]*m[8], m[1]*m[5]-m[2]*m[4],
        m[5]*m[6]-m[3]*m[8], m[0]*m[8]-m[2]*m[6], m[2]*m[3]-m[0]*m[5],
        m[3]*m[7]-m[4]*m[6], m[1]*m[6]-m[0]*m[7], m[0]*m[4]-m[1]*m[3]
      ];
    }
    function multmm(a, b) {
      const c = [];
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
        let s = 0;
        for (let k = 0; k < 3; k++) s += a[3*i+k]*b[3*k+j];
        c[3*i+j] = s;
      }
      return c;
    }
    function multmv(m, v) {
      return [m[0]*v[0]+m[1]*v[1]+m[2]*v[2], m[3]*v[0]+m[4]*v[1]+m[5]*v[2], m[6]*v[0]+m[7]*v[1]+m[8]*v[2]];
    }
    function basisToPoints(x1,y1,x2,y2,x3,y3,x4,y4) {
      const m = [x1,x2,x3, y1,y2,y3, 1,1,1];
      const v = multmv(adj(m), [x4,y4,1]);
      return multmm(m, [v[0],0,0, 0,v[1],0, 0,0,v[2]]);
    }
    // H: local (0,0)-(w,h) -> quadrilátero destino. Devolve a 3x3 normalizada.
    function homografia(w, h, d) {
      const s = basisToPoints(0,0, w,0, 0,h, w,h);
      const t = multmm(basisToPoints(...d), adj(s));
      for (let i = 0; i < 9; i++) t[i] /= t[8];
      return t;
    }
    function aplicar(elt, t) {
      const m = [t[0],t[3],0,t[6], t[1],t[4],0,t[7], 0,0,1,0, t[2],t[5],0,t[8]];
      elt.style.transformOrigin = '0 0';
      elt.style.transform = 'matrix3d(' + m.join(',') + ')';
    }
    function paraLocal(t, x, y) {
      const inv = adj(t);
      const v = multmv(inv, [x, y, 1]);
      return [v[0]/v[2], v[1]/v[2]];
    }

    // Notebook: cantos por varredura de pixels da base (bordas do branco da tela),
    // com 2px de transbordo para encostar no bezel. TL, TR, BL, BR em 1200×800.
    const nb = document.getElementById('tela-nb');
    const tNb = homografia(1363, 832, [429,236, 950,238, 410,556, 933,581]);
    // Oclusão do celular: entalhe SÓ na região do celular (abaixo do topo dele,
    // canvas y>356, à direita da linha 925,356 → 898,930). Acima do celular o
    // conteúdo segue inteiro — um clip vertical até o topo cortava o "Buscar".
    const pl = (x, y) => paraLocal(tNb, x, y).map((v) => v.toFixed(1) + 'px').join(' ');
    nb.style.clipPath = 'polygon(-40px -40px, 1420px -40px, '
      + pl(1300, 356) + ', ' + pl(925, 356) + ', ' + pl(898, 930) + ', ' + pl(-80, 930) + ', -40px 900px)';
    aplicar(nb, tNb);

    // Celular: conteúdo cobre o vidro inteiro (como app real); a ilha é repintada
    // por cima pelo #ilha. Bordas todas varridas de dentro para fora.
    // Inset de 1.5px: a aresta do layer 3D não recebe antialiasing do Chromium;
    // dentro do vidro ela cai creme-sobre-creme (invisível) em vez de sobre a
    // moldura preta (degraus visíveis).
    aplicar(document.getElementById('tela-ph'),
      homografia(137, 284, [942.5,366.5, 1063.5,369.5, 933.5,620.5, 1053.5,627.5]));
  </script>
</body>
</html>
