<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cena Guia — notebook + celular na landing</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 800px; overflow: hidden; background: #F4EEE0; position: relative; }
  /* Base 6% ampliada para jogar a moldura pintada da IA para fora do quadro;
     laterais e topo esfumados no creme da landing (--bg #F4EEE0). */
  img.base {
    position: absolute; left: -36px; top: -24px; width: 1272px; height: 848px;
    -webkit-mask-image:
      linear-gradient(to right, transparent 36px, #000 176px, #000 1116px, transparent 1236px),
      linear-gradient(to bottom, transparent 24px, #000 120px, #000 848px);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 36px, #000 176px, #000 1116px, transparent 1236px),
      linear-gradient(to bottom, transparent 24px, #000 120px, #000 848px);
    mask-composite: intersect;
  }
  .tela { position: absolute; left: 0; top: 0; overflow: hidden; background: #F6F2EA; }
  #tela-nb { width: 1363px; height: 832px; }
  #tela-nb img { display: block; width: 1363px; }
  #tela-ph { width: 137px; height: 284px; }
  #tela-ph img { display: block; width: 145px; margin: -29px 0 0 -4px; }
  /* Ilha da câmera repintada da base por cima do conteúdo: no aparelho real o
     hardware flutua sobre o app, o app não começa abaixo dele. */
  #ilha {
    position: absolute; left: 967px; top: 358px; width: 81px; height: 26px;
    background-image: url('cena-base-ia.png');
    background-size: 1272px 848px;
    background-position: -1003px -382px;
  }
</style>
</head>
<body>
  <img class="base" src="cena-base-ia.png" alt="">
  <div class="tela" id="tela-nb"><img src="tela-roteiro-desktop.png" alt=""></div>
  <div class="tela" id="tela-ph"><img src="tela-patacho.jpg" alt=""></div>
  <div id="ilha"></div>
  <script src="../../../../assets/composicao.js"></script>
  <script>
    /* Quads medidos por `render.mjs medir-tela` sobre cena-base-ia.png, já em
     * coordenadas do quadro (--mapa "0.828125,-36,-24"):
     *
     *   medir-tela cena-base-ia.png --regiao "560,325,1180,700" --dir "325,455" --mapa ...
     *   medir-tela cena-base-ia.png --regiao "1180,470,1320,780" --mapa ...
     *
     * O --dir do notebook restringe a borda direita ao trecho que o celular não
     * oclui; sem isso a varredura acha a moldura do celular e erra 6px. */
    const NOTEBOOK = [430.5, 235, 950.7, 237.5, 410.2, 556.4, 931.7, 582.4]
    const CELULAR = [940.7, 364.2, 1065.1, 367.1, 931.5, 624.3, 1055.8, 630.4]

    const nb = document.getElementById('tela-nb')
    const tNb = NP.tela(nb, NOTEBOOK, { raio: 26 })
    /* Entalhe do celular: recorta só onde ele passa na frente (a partir do topo
     * dele, y=356 do quadro, à direita da sua borda esquerda). O resto da tela
     * segue inteiro — corte de altura cheia comia o "Buscar" lá em cima. */
    NP.poligono(nb, tNb, [
      [300, 150], [1300, 150], [1300, 356], [925, 356], [898, 930], [300, 930],
    ])

    NP.tela(document.getElementById('tela-ph'), CELULAR, { raio: 14 })
  </script>
</body>
</html>
