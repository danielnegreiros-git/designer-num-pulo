<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Thumbnail — Barcelona</title>
<link rel="stylesheet" href="../../../assets/fonts.css">
<link rel="stylesheet" href="../../../design-system/tokens.css">
<style>
  /* Thumbnail YouTube 1280×720 — padrão extraído dos 3 últimos vídeos do canal
     (Noronha, Madri, Serra da Canastra), medido por pixel, não a olho. Ver brief.md.
     Sem vinheta: o contraste vem da escolha do enquadramento da foto, não de
     pós-processamento. Render: --largura 1280 --altura 720 --escala 2. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000; }
  body { width: 1280px; }

  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    color: #fff;
  }
  .foto {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 28%;
    display: block;
  }

  .bloco {
    position: absolute;
    left: 90px;
    top: 46px;
    z-index: 2;
  }

  .anton {
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    font-weight: 400;
    line-height: .92;
    letter-spacing: .004em;
    margin: 0;
    color: #fff;
  }
  .titulo    { font-size: 150px; }
  .subtitulo { font-size: 110px; margin-top: 4px; }
</style>
</head>
<body>

<section class="slide">
  <img class="foto" src="imagens/barcelona-park-guell.jpg">
  <div class="bloco">
    <p class="anton titulo">BARCELONA</p>
    <p class="anton subtitulo">ALÉM DO ÓBVIO</p>
  </div>
</section>

</body>
</html>
