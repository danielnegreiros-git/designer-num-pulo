<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mockup Guia — landing</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 800px; overflow: hidden; background: #14101D; }
  .cena { position: relative; width: 100%; height: 100%; }
  .cena > img.foto {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: 100% 42%;
  }
  /* Véu de marca: escurece a direita para o mockup assentar, como o hero da landing */
  .veu {
    position: absolute; inset: 0;
    background:
      linear-gradient(to right, rgba(20,16,29,0) 50%, rgba(20,16,29,0.34) 72%, rgba(20,16,29,0.62) 100%),
      linear-gradient(to top, rgba(20,16,29,0.30) 0%, rgba(20,16,29,0) 30%);
  }
  .mockup {
    position: absolute;
    right: -30px; bottom: 52px;
    width: 63%;
    filter: drop-shadow(0 34px 50px rgba(0,0,0,0.5));
  }
</style>
</head>
<body>
  <div class="cena">
    <img class="foto" src="foto-noronha.jpg" alt="">
    <div class="veu"></div>
    <img class="mockup" src="mockup-telas.png" alt="">
  </div>
</body>
</html>
